apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: voting-app-vote
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Mohammed-Azam-Sohail/voting-app-vote.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: voting-app

  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=false
